<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment</title>
    <link rel="stylesheet" href="style.css">
    <style>
      
    </style>
    
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html">
                <img src="logo2.png" alt="Correctify Logo" class="logo">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="schedule.html" class="active">Schedule Appointment</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search...">
                <i class="fas fa-search search-icon"></i>
            </div>
        </nav>
    </header>

    
    <script>
        document.getElementById('appointmentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        });
    </script>
    
    <!-- Schedule Appointment Section -->
    <section class="appointment-section">
        <h2>Schedule Your Appointment</h2>
        <p>Choose a date and time that works best for you. Let’s make things happen!</p>
        <form class="appointment-form" id="appointmentForm">
            <div class="form-group">
                <label for="appointment-date">Date</label>
                <input type="date" id="appointment-date" required>
            </div>
            <div class="form-group">
                <label for="appointment-time">Time</label>
                <input type="time" id="appointment-time" required>
            </div>
            <button type="submit">Confirm Appointment</button>
        </form>
        <div class="success-message" id="successMessage">
            Appointment scheduled successfully!
        </div>
    </section>

    <footer>
        <p>
            &copy; 2024 Correctify. All Rights Reserved. 
        </p>
    </footer>
    <script>
        document.getElementById('appointmentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        });
    </script>
</body>
</html>
